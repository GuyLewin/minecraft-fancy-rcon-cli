[package]
name = "minecraft-fancy-rcon-cli"
version = "0.2.0"
edition = "2021"

description = "A Rust-based Minecraft RCON CLI with rustyline autocompletion."
repository = "https://github.com/GuyLewin/minecraft-fancy-rcon-cli"
readme = "README.md"
keywords = ["minecraft", "rcon", "cli"]
license = "MIT"
categories = ["command-line-utilities"]

[dependencies]
rustyline = "15.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
